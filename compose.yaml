services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local POSTGRES_PASSWORD}
      POSTGRES_DB: belajar_animasi
    ports: ['127.0.0.1:5433:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d belajar_animasi']
      interval: 3s
      timeout: 3s
      retries: 15
    security_opt: ['no-new-privileges:true']
  db-test:
    image: postgres:17.7-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set local TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: belajar_animasi_test
    ports: ['127.0.0.1:5434:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d belajar_animasi_test']
      interval: 3s
      timeout: 3s
      retries: 15
    security_opt: ['no-new-privileges:true']
volumes:
  postgres-data:
