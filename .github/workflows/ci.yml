name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm local:setup
      - run: docker compose --profile test up -d --wait
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:reader
      - run: pnpm db:seed
      - run: pnpm db:test:prepare
      - run: pnpm contracts
      - run: git diff --exit-code -- packages/shared/openapi.json packages/shared/src/api.d.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        run: docker compose --profile test down
